app = "skanda"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "skhand_data"
  destination = "/data"

[env]
  CHROMA_PERSIST_DIR = "/data/chromadb"
  DB_PATH = "/data/skhand.db"
