{% extends "base.html" %}
{% set active = "graph" %}
{% block title %}Skhand — Knowledge Graph{% endblock %}

{% block content %}
<h1>Knowledge Graph Explorer</h1>

<div class="search-row">
    <input type="text" class="search-input" id="concept-input"
           placeholder="Search for a concept (e.g. Chandrarka, Bhasma, Agni)...">
    <button class="btn" id="search-btn" onclick="searchGraph()">Search</button>
</div>

<div id="results-area"></div>

<div style="margin-top: 2rem;">
    <h2 style="color: var(--text-secondary); margin-bottom: 1rem;">Find Equivalents</h2>
    <div class="search-row">
        <input type="text" class="search-input" id="equiv-input"
               placeholder="Sanskrit or modern concept name...">
        <button class="btn btn-green" onclick="searchEquivalents()">Equivalents</button>
    </div>
    <div id="equiv-area"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const conceptInput = document.getElementById('concept-input');
const equivInput = document.getElementById('equiv-input');

conceptInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchGraph(); });
equivInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchEquivalents(); });

async function searchGraph() {
    const concept = conceptInput.value.trim();
    if (!concept) return;

    const area = document.getElementById('results-area');
    area.innerHTML = '<div class="loading"><div class="spinner"></div><span>Querying graph...</span></div>';

    try {
        const resp = await fetch(`/api/graph/query?concept=${encodeURIComponent(concept)}`);
        const data = await resp.json();

        if (data.error) {
            area.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
            return;
        }

        if (!data.results || data.results.length === 0) {
            area.innerHTML = `<div class="empty-state"><p>No results for "${escapeHtml(concept)}"</p></div>`;
            return;
        }

        let html = `<table>
            <thead><tr>
                <th>Node</th><th>Type</th><th>Domain</th>
                <th>Relationship</th><th>Connected To</th><th>Confidence</th>
            </tr></thead><tbody>`;

        for (const r of data.results) {
            const name = r.sanskrit ? `${escapeHtml(r.name)} (${escapeHtml(r.sanskrit)})` : escapeHtml(r.name);
            const conf = r.confidence != null ? formatConfidence(r.confidence) : '';
            html += `<tr>
                <td>${name}</td>
                <td>${escapeHtml(r.type || '')}</td>
                <td>${escapeHtml(r.domain || '')}</td>
                <td>${escapeHtml(r.relationship || '')}</td>
                <td>${escapeHtml(r.connected_to || '')}</td>
                <td>${conf}</td>
            </tr>`;
        }

        html += '</tbody></table>';
        area.innerHTML = html;

    } catch (err) {
        area.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
    }
}

async function searchEquivalents() {
    const concept = equivInput.value.trim();
    if (!concept) return;

    const area = document.getElementById('equiv-area');
    area.innerHTML = '<div class="loading"><div class="spinner"></div><span>Finding equivalents...</span></div>';

    try {
        const resp = await fetch(`/api/graph/equivalents?concept=${encodeURIComponent(concept)}`);
        const data = await resp.json();

        if (data.error) {
            area.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
            return;
        }

        if (!data.results || data.results.length === 0) {
            area.innerHTML = `<div class="empty-state"><p>No equivalents found for "${escapeHtml(concept)}"</p></div>`;
            return;
        }

        let html = `<table>
            <thead><tr>
                <th>Source</th><th>Source Type</th>
                <th>Target</th><th>Target Type</th>
                <th>Confidence</th><th>Evidence</th>
            </tr></thead><tbody>`;

        for (const r of data.results) {
            const conf = r.confidence != null ? formatConfidence(r.confidence) : '';
            html += `<tr>
                <td>${escapeHtml(r.source)}</td>
                <td>${escapeHtml(r.source_type || '')}</td>
                <td>${escapeHtml(r.target)}</td>
                <td>${escapeHtml(r.target_type || '')}</td>
                <td>${conf}</td>
                <td>${escapeHtml(r.evidence || '')}</td>
            </tr>`;
        }

        html += '</tbody></table>';
        area.innerHTML = html;

    } catch (err) {
        area.innerHTML = `<div class="error-msg">${escapeHtml(err.message)}</div>`;
    }
}

function formatConfidence(val) {
    const pct = Math.round(val * 100);
    let cls = 'conf-low';
    if (pct >= 80) cls = 'conf-high';
    else if (pct >= 50) cls = 'conf-med';
    return `<span class="confidence-badge ${cls}">${pct}%</span>`;
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}
</script>
{% endblock %}
